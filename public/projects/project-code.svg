  <circle cx="68" cy="21" r="6" fill="#22c55e"/>
  <text x="400" y="26" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">video_diffusion_pipeline.py</text>
  
  <!-- Code Lines -->
  <g font-family="monospace" font-size="14" font-weight="500">
    <text x="40" y="85" fill="#64748b">01</text>
    <text x="80" y="85" fill="#a855f7">import</text>
    <text x="140" y="85" fill="#f8fafc">diffusers, torch</text>
    
    <text x="40" y="115" fill="#64748b">02</text>
    <text x="80" y="115" fill="#a855f7">class</text>
    <text x="135" y="115" fill="#38bdf8">TemporalVideoDenoiser</text>
    <text x="325" y="115" fill="#f8fafc">(torch.nn.Module):</text>
    
    <text x="40" y="155" fill="#64748b">03</text>
    <text x="110" y="155" fill="#f43f5e">def</text>
    <text x="145" y="155" fill="#38bdf8">forward</text>
    <text x="215" y="155" fill="#f8fafc">(self, latent_trajectory, prompt_embeds):</text>
    
    <text x="40" y="185" fill="#64748b">04</text>
    <text x="140" y="185" fill="#64748b"># Compute temporal cross-attention for 60fps smoothing</text>
    
    <text x="40" y="215" fill="#64748b">05</text>
    <text x="140" y="215" fill="#f8fafc">hidden_states = self.temporal_attn(latent_trajectory)</text>
    
    <text x="40" y="245" fill="#64748b">06</text>
    <text x="140" y="245" fill="#f8fafc">motion_vectors = self.optical_flow_head(hidden_states)</text>
    
    <text x="40" y="275" fill="#64748b">07</text>
    <text x="140" y="275" fill="#cffe00">return</text>
    <text x="200" y="275" fill="#f8fafc">self.vae.decode_video(motion_vectors)</text>
  </g>
  
