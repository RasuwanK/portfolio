      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>
  </defs>
  
  <!-- Editor Window -->
  <rect width="800" height="500" rx="16" fill="url(#bg2)"/>
  
  <!-- Window Header -->
  <rect width="800" height="42" fill="#030712" rx="16"/>
  <rect y="30" width="800" height="12" fill="#030712"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
