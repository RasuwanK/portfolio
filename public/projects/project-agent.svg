<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
  </defs>
  
  <!-- Window Container -->
  <rect width="800" height="500" rx="16" fill="url(#bg3)"/>
  
  <!-- Top bar -->
  <rect width="800" height="42" fill="#060c1c" rx="16"/>
  <rect y="30" width="800" height="12" fill="#060c1c"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#eab308"/>
  <circle cx="68" cy="21" r="6" fill="#22c55e"/>
  <text x="400" y="26" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">swarm_orchestrator.ts (Agent Coordination Network)</text>

  <!-- Multi-Agent Node Architecture Flow -->
  <g transform="translate(50, 70)">
    <!-- Planner Agent -->
    <rect x="250" y="20" width="200" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="350" y="55" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">⚡ Lead Architect Agent</text>
    
    <!-- Connectors -->
    <line x1="350" y1="80" x2="130" y2="150" stroke="#38bdf8" stroke-dasharray="4" stroke-width="2"/>
    <line x1="350" y1="80" x2="350" y2="150" stroke="#cffe00" stroke-width="2"/>
    <line x1="350" y1="80" x2="570" y2="150" stroke="#ec4899" stroke-dasharray="4" stroke-width="2"/>

    <!-- Sub Agents -->
    <rect x="30" y="150" width="200" height="70" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="130" y="180" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Coder Agent 01</text>
    <text x="130" y="202" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Generates Ast &amp; Diffs</text>

    <rect x="250" y="150" width="200" height="70" rx="10" fill="#0f172a" stroke="#cffe00" stroke-width="2"/>
    <text x="350" y="180" fill="#cffe00" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Test &amp; Sandbox Agent</text>
    <text x="350" y="202" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Executes Container E2E</text>

    <rect x="470" y="150" width="200" height="70" rx="10" fill="#0f172a" stroke="#ec4899" stroke-width="1.5"/>
    <text x="570" y="180" fill="#ec4899" font-family="monospace" font-size="13" font-weight="bold" text-anchor="middle">Reviewer Agent</text>
    <text x="570" y="202" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Lints, AST Verify &amp; PR</text>

    <!-- Execution Terminal / Metrics -->
    <rect x="30" y="250" width="640" height="150" rx="10" fill="#020617" stroke="#1e293b"/>
    <text x="50" y="280" fill="#22c55e" font-family="monospace" font-size="12">✔ Swarm initialization: 4 agents synchronized</text>
    <text x="50" y="305" fill="#38bdf8" font-family="monospace" font-size="12">ℹ AST Mutation pass: 14 test cases synthesized</text>
    <text x="50" y="330" fill="#f8fafc" font-family="monospace" font-size="12">↳ Docker Sandbox: 100% test coverage passed in 1.42s</text>
    <text x="50" y="355" fill="#cffe00" font-family="monospace" font-size="12">★ PR #142 auto-drafted with verified unit checks and benchmarks</text>
    <text x="50" y="380" fill="#64748b" font-family="monospace" font-size="12">Status: SWARM IDLE - LISTENING FOR NEW ISSUES_</text>
  </g>
</svg>

