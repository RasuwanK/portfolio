<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1f2937" stroke-width="1"/>
    </pattern>
  </defs>
  
  <rect width="800" height="500" rx="16" fill="url(#bg4)"/>
  <rect width="800" height="500" fill="url(#grid)" rx="16"/>
  
  <!-- Header -->
  <rect width="800" height="42" fill="#0b0f19" rx="16"/>
  <rect y="30" width="800" height="12" fill="#0b0f19"/>
  <circle cx="28" cy="21" r="6" fill="#ef4444"/>
  <circle cx="48" cy="21" r="6" fill="#eab308"/>
  <circle cx="68" cy="21" r="6" fill="#22c55e"/>
  <text x="400" y="26" fill="#64748b" font-family="monospace" font-size="13" text-anchor="middle">canvas_workspace.glsl (Infinite Spatial Generative Canvas)</text>

  <!-- Canvas Nodes -->
  <g transform="translate(60, 60)">
    <!-- Node 1: Prompt Input -->
    <rect x="20" y="80" width="180" height="100" rx="10" fill="#1f2937" stroke="#3b82f6" stroke-width="2"/>
    <rect x="20" y="80" width="180" height="28" rx="10" fill="#3b82f6"/>
    <text x="110" y="100" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Prompt Generator</text>
    <text x="35" y="135" fill="#93c5fd" font-family="monospace" font-size="11">"Cybernetic Flora"</text>
    <text x="35" y="155" fill="#64748b" font-family="monospace" font-size="10">cfg: 7.5 | steps: 30</text>

    <!-- Node 2: Latent Interpolator -->
    <rect x="260" y="120" width="200" height="120" rx="10" fill="#1f2937" stroke="#cffe00" stroke-width="2"/>
    <rect x="260" y="120" width="200" height="28" rx="10" fill="#cffe00"/>
    <text x="360" y="140" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Latent Interpolator</text>
    <circle cx="360" cy="185" r="24" fill="#10b981" opacity="0.4"/>
    <circle cx="360" cy="185" r="16" fill="#cffe00" opacity="0.8"/>
    <text x="360" y="225" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">t = 0.84 (Spherical Lerp)</text>

    <!-- Node 3: Realtime Viewport -->
    <rect x="510" y="50" width="190" height="180" rx="10" fill="#1f2937" stroke="#ec4899" stroke-width="2"/>
    <rect x="510" y="50" width="190" height="28" rx="10" fill="#ec4899"/>
    <text x="605" y="70" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">WebGL Shader Output</text>
    <rect x="525" y="90" width="160" height="120" rx="6" fill="#030712"/>
    <!-- Abstract Generative Shape -->
    <polygon points="605,100 660,170 630,200 560,190 550,130" fill="#cffe00" opacity="0.75"/>
    <polygon points="605,115 645,160 580,180" fill="#ec4899" opacity="0.6"/>

    <!-- Connecting Wires -->
    <path d="M 200 130 C 230 130, 230 170, 260 170" fill="none" stroke="#3b82f6" stroke-width="3"/>
    <path d="M 460 180 C 485 180, 485 140, 510 140" fill="none" stroke="#cffe00" stroke-width="3"/>
  </g>
</svg>

